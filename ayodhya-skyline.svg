<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 620" width="100%" height="100%" preserveAspectRatio="xMidYMax slice">
  <defs>
    <!-- Warm Golden Mandir Silhouette Gradient -->
    <linearGradient id="mandirGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#ffb300" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#ff8f00" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ff6f00" stop-opacity="0.05" />
    </linearGradient>

    <!-- Distant Ayodhya City Palace Silhouette Gradient -->
    <linearGradient id="cityGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ff9800" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#e65100" stop-opacity="0.0" />
    </linearGradient>

    <!-- Divine Shikhara Halo Aura -->
    <radialGradient id="haloAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9c4" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#ffd54f" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#ff9800" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ff6f00" stop-opacity="0" />
    </radialGradient>

    <!-- Saffron Dhwaja Gradient -->
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#ff9933" />
      <stop offset="100%" stop-color="#ff4500" />
    </linearGradient>

    <!-- Golden Stroke Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .flag-wave {
        transform-origin: 0% 50%;
        animation: flagFlutter 2.5s ease-in-out infinite alternate;
      }
      @keyframes flagFlutter {
        0% { transform: scaleX(1) skewY(0deg); }
        50% { transform: scaleX(0.92) skewY(2.5deg); }
        100% { transform: scaleX(1.05) skewY(-2deg); }
      }
      .kalash-pulse {
        animation: kalashGlow 3s ease-in-out infinite alternate;
      }
      @keyframes kalashGlow {
        0% { filter: drop-shadow(0 0 4px #ffd700); }
        100% { filter: drop-shadow(0 0 12px #ff9900); }
      }
      .diya-twinkle {
        animation: diyaSparkle 1.8s ease-in-out infinite alternate;
      }
      @keyframes diyaSparkle {
        0% { opacity: 0.5; transform: scale(0.9); }
        100% { opacity: 1; transform: scale(1.15); }
      }
    </style>
  </defs>

  <!-- Divine Background Aura behind Main Mandir Spire -->
  <circle cx="960" cy="140" r="260" fill="url(#haloAura)" opacity="0.55" />

  <!-- =========================================================================
       LAYER 1: DISTANT AYODHYA CITY SKYLINE (Palaces, Gopurams, Ancient Walls)
       ========================================================================= -->
  <g fill="url(#cityGrad)" stroke="rgba(255, 215, 0, 0.3)" stroke-width="0.8">
    <!-- Far Left: Royal Fortifications and Temples (0 - 450) -->
    <path d="
      M 0 620 L 0 490 L 30 490 L 30 440 L 45 440 L 45 380 L 55 350 L 65 380 L 65 440 L 80 440 L 80 490
      L 120 490 L 120 420 L 140 420 L 155 370 L 165 320 L 175 370 L 190 420 L 210 420 L 210 490
      L 240 490 L 240 460 L 260 460 L 270 410 L 285 410 L 295 460 L 320 460 L 320 490
      L 350 490 L 350 390 L 365 390 L 380 310 L 395 390 L 410 390 L 410 490
      L 450 490 L 450 620 Z
    " />

    <!-- Left Chhatri details -->
    <circle cx="165" cy="316" r="4" fill="#ffd54f" />
    <circle cx="380" cy="306" r="4" fill="#ffd54f" />

    <!-- Far Right: Ancient Ayodhya Palaces and Temples (1470 - 1920) -->
    <path d="
      M 1470 620 L 1470 490 L 1510 490 L 1510 390 L 1525 390 L 1540 310 L 1555 390 L 1570 390 L 1570 490
      L 1600 490 L 1600 460 L 1625 460 L 1635 410 L 1650 410 L 1660 460 L 1680 460 L 1680 490
      L 1710 490 L 1710 420 L 1730 420 L 1745 370 L 1755 320 L 1765 370 L 1780 420 L 1800 420 L 1800 490
      L 1840 490 L 1840 440 L 1855 440 L 1865 350 L 1875 440 L 1890 440 L 1890 490 L 1920 490 L 1920 620 Z
    " />
    <circle cx="1540" cy="306" r="4" fill="#ffd54f" />
    <circle cx="1755" cy="316" r="4" fill="#ffd54f" />
  </g>

  <!-- =========================================================================
       LAYER 2: AYODHYA SHREE RAM JANMABHOOMI MANDIR COMPLEX (Grand Nagara Style)
       Centered at X=960, Width ~ 1000px, Height from Y=620 up to Y=65
       ========================================================================= -->
  <g fill="url(#mandirGrad)" stroke="rgba(255, 235, 150, 0.55)" stroke-width="1.2">
    
    <!-- Outer Flanking Shikharas (Left X=560, Right X=1360) -->
    <!-- Left Outer Shikhara (X=560) -->
    <path d="
      M 510 580 L 510 480 L 530 480 L 530 430 L 545 380 L 560 300 L 575 380 L 590 430 L 590 480 L 610 480 L 610 580 Z
    " />
    <ellipse cx="560" cy="296" rx="16" ry="6" fill="#ffe082" />
    <circle cx="560" cy="285" r="5" fill="#ffd54f" />
    <line x1="560" y1="280" x2="560" y2="255" stroke="#ff9933" stroke-width="2" />
    <polygon points="560,255 585,263 560,272" fill="url(#saffronGrad)" class="flag-wave" />

    <!-- Right Outer Shikhara (X=1360) -->
    <path d="
      M 1310 580 L 1310 480 L 1330 480 L 1330 430 L 1345 380 L 1360 300 L 1375 380 L 1390 430 L 1390 480 L 1410 480 L 1410 580 Z
    " />
    <ellipse cx="1360" cy="296" rx="16" ry="6" fill="#ffe082" />
    <circle cx="1360" cy="285" r="5" fill="#ffd54f" />
    <line x1="1360" y1="280" x2="1360" y2="255" stroke="#ff9933" stroke-width="2" />
    <polygon points="1360,255 1385,263 1360,272" fill="url(#saffronGrad)" class="flag-wave" />

    <!-- Intermediate Mandapas (Left X=730, Right X=1190) -->
    <!-- Left Mandapa Dome (X=730) -->
    <path d="
      M 650 580 L 650 460 L 675 460 L 675 410 L 700 350 L 730 230 L 760 350 L 785 410 L 785 460 L 810 460 L 810 580 Z
    " />
    <ellipse cx="730" cy="226" rx="18" ry="7" fill="#ffe082" />
    <circle cx="730" cy="214" r="6" fill="#ffd54f" />
    <line x1="730" y1="208" x2="730" y2="180" stroke="#ff9933" stroke-width="2" />
    <polygon points="730,180 758,190 730,200" fill="url(#saffronGrad)" class="flag-wave" />

    <!-- Right Mandapa Dome (X=1190) -->
    <path d="
      M 1110 580 L 1110 460 L 1135 460 L 1135 410 L 1160 350 L 1190 230 L 1220 350 L 1245 410 L 1245 460 L 1270 460 L 1270 580 Z
    " />
    <ellipse cx="1190" cy="226" rx="18" ry="7" fill="#ffe082" />
    <circle cx="1190" cy="214" r="6" fill="#ffd54f" />
    <line x1="1190" y1="208" x2="1190" y2="180" stroke="#ff9933" stroke-width="2" />
    <polygon points="1190,180 1218,190 1190,200" fill="url(#saffronGrad)" class="flag-wave" />

    <!-- Sub-Central Shikharas (Left X=860, Right X=1060) -->
    <!-- Left Inner Shikhara (X=860) -->
    <path d="
      M 800 580 L 800 440 L 820 440 L 820 370 L 840 280 L 860 170 L 880 280 L 900 370 L 900 440 L 920 440 L 920 580 Z
    " />
    <ellipse cx="860" cy="165" rx="22" ry="8" fill="#ffe082" />
    <circle cx="860" cy="150" r="7" fill="#ffd54f" />
    <line x1="860" y1="143" x2="860" y2="110" stroke="#ff9933" stroke-width="2.2" />
    <polygon points="860,110 892,122 860,134" fill="url(#saffronGrad)" class="flag-wave" />

    <!-- Right Inner Shikhara (X=1060) -->
    <path d="
      M 1000 580 L 1000 440 L 1020 440 L 1020 370 L 1040 280 L 1060 170 L 1080 280 L 1100 370 L 1100 440 L 1120 440 L 1120 580 Z
    " />
    <ellipse cx="1060" cy="165" rx="22" ry="8" fill="#ffe082" />
    <circle cx="1060" cy="150" r="7" fill="#ffd54f" />
    <line x1="1060" y1="143" x2="1060" y2="110" stroke="#ff9933" stroke-width="2.2" />
    <polygon points="1060,110 1092,122 1060,134" fill="url(#saffronGrad)" class="flag-wave" />

    <!-- =======================================================================
         CENTRAL GARBHAGRIHA MAIN SHIKHARA (Apex of Ram Mandir at X=960)
         ======================================================================= -->
    <!-- Stepped Nagara Urushringa Spire Base -->
    <path d="
      M 885 580 L 885 410 L 905 410 L 905 320 L 925 240 L 945 150 L 960 70 L 975 150 L 995 240 L 1015 320 L 1015 410 L 1035 410 L 1035 580 Z
    " fill="url(#mandirGrad)" stroke="#ffd54f" stroke-width="1.5" />

    <!-- Ornate Architectural Horizontal Ribs on Main Shikhara -->
    <path d="M 915 340 Q 960 330 1005 340" stroke="rgba(255, 235, 150, 0.7)" stroke-width="1.2" fill="none" />
    <path d="M 925 290 Q 960 282 995 290" stroke="rgba(255, 235, 150, 0.7)" stroke-width="1.2" fill="none" />
    <path d="M 935 240 Q 960 234 985 240" stroke="rgba(255, 235, 150, 0.7)" stroke-width="1.2" fill="none" />
    <path d="M 943 190 Q 960 185 977 190" stroke="rgba(255, 235, 150, 0.7)" stroke-width="1.2" fill="none" />
    <path d="M 950 140 Q 960 136 970 140" stroke="rgba(255, 235, 150, 0.7)" stroke-width="1.2" fill="none" />

    <!-- Grand Amalaka (Sacred Fluted Disc) -->
    <ellipse cx="960" cy="65" rx="30" ry="11" fill="#fff8e1" stroke="#ffd700" stroke-width="1.5" />
    <ellipse cx="960" cy="56" rx="20" ry="8" fill="#ffd54f" stroke="#ffa000" stroke-width="1.2" />

    <!-- Sacred Golden Kalash -->
    <circle cx="960" cy="44" r="9" fill="#fff9c4" stroke="#ffd700" stroke-width="1.5" class="kalash-pulse" />
    <polygon points="960,25 956,35 964,35" fill="#ffd700" />

    <!-- Royal Golden Flagpole & Fluttering Sacred Saffron Dhwaja -->
    <line x1="960" y1="35" x2="960" y2="2" stroke="#ffd700" stroke-width="3" stroke-linecap="round" />
    <!-- Saffron Dhwaja with Sun Symbol (Surya Vansh of Bhagwan Ram) -->
    <g class="flag-wave">
      <polygon points="960,4 1010,20 960,36" fill="url(#saffronGrad)" stroke="#ffd700" stroke-width="1" />
      <circle cx="978" cy="18" r="4" fill="#ffd700" />
    </g>
  </g>

  <!-- =========================================================================
       LAYER 3: TEMPLE PILLARS, CARVED ARCHES & GLOWING SANCTUM (Y=420 to Y=580)
       ========================================================================= -->
  <g fill="rgba(255, 215, 0, 0.15)" stroke="rgba(255, 225, 120, 0.55)" stroke-width="1.2">
    <!-- Main Plinth Foundation (Jagati) Stepped Terrace -->
    <rect x="440" y="540" width="1040" height="40" rx="2" fill="url(#mandirGrad)" />
    <line x1="420" y1="555" x2="1500" y2="555" stroke="rgba(255, 235, 150, 0.7)" stroke-width="1.5" />
    <line x1="400" y1="580" x2="1520" y2="580" stroke="rgba(255, 235, 150, 0.8)" stroke-width="2" />

    <!-- Carved Nagara Temple Pillars -->
    <!-- Left Pillars -->
    <rect x="550" y="470" width="12" height="70" rx="2" fill="#ffe082" />
    <rect x="630" y="470" width="12" height="70" rx="2" fill="#ffe082" />
    <rect x="710" y="470" width="14" height="70" rx="2" fill="#ffe082" />
    <rect x="790" y="470" width="14" height="70" rx="2" fill="#ffe082" />
    <rect x="870" y="470" width="16" height="70" rx="2" fill="#ffe082" />

    <!-- Right Pillars -->
    <rect x="1034" y="470" width="16" height="70" rx="2" fill="#ffe082" />
    <rect x="1116" y="470" width="14" height="70" rx="2" fill="#ffe082" />
    <rect x="1196" y="470" width="14" height="70" rx="2" fill="#ffe082" />
    <rect x="1276" y="470" width="12" height="70" rx="2" fill="#ffe082" />
    <rect x="1356" y="470" width="12" height="70" rx="2" fill="#ffe082" />

    <!-- Central Glowing Sanctum Portal (Garbhagriha Dwar) at X=960 -->
    <path d="M 925 540 L 925 460 Q 960 430 995 460 L 995 540 Z" fill="#ff9800" opacity="0.55" />
    <path d="M 935 540 L 935 470 Q 960 445 985 470 L 985 540 Z" fill="#fff176" opacity="0.7" />
    <circle cx="960" cy="490" r="12" fill="#ffffff" opacity="0.85" filter="url(#goldGlow)" />

    <!-- Traditional Carved Torana Arches across Mandapa Pillars -->
    <path d="M 550 475 Q 590 455 630 475" fill="none" stroke="#ffd54f" stroke-width="1.5" />
    <path d="M 630 475 Q 670 455 710 475" fill="none" stroke="#ffd54f" stroke-width="1.5" />
    <path d="M 710 475 Q 750 455 790 475" fill="none" stroke="#ffd54f" stroke-width="1.5" />
    <path d="M 790 475 Q 830 455 870 475" fill="none" stroke="#ffd54f" stroke-width="1.5" />
    <path d="M 870 475 Q 915 450 960 475" fill="none" stroke="#ffd54f" stroke-width="1.5" />
    <path d="M 960 475 Q 1005 450 1050 475" fill="none" stroke="#ffd54f" stroke-width="1.5" />
    <path d="M 1050 475 Q 1090 455 1130 475" fill="none" stroke="#ffd54f" stroke-width="1.5" />
    <path d="M 1130 475 Q 1170 455 1210 475" fill="none" stroke="#ffd54f" stroke-width="1.5" />
    <path d="M 1210 475 Q 1250 455 1290 475" fill="none" stroke="#ffd54f" stroke-width="1.5" />
    <path d="M 1290 475 Q 1330 455 1370 475" fill="none" stroke="#ffd54f" stroke-width="1.5" />
  </g>

  <!-- =========================================================================
       LAYER 4: FESTIVE DEEPOTSAV DIYAS ALONG AYODHYA GHATS & PARAPETS
       ========================================================================= -->
  <g class="diya-twinkle">
    <!-- Plinth Diyas (Small Golden Points with Flames) -->
    <circle cx="450" cy="536" r="2.5" fill="#ffe082" /><path d="M 450 536 Q 448 530 450 526 Q 452 530 450 536 Z" fill="#ff5500" />
    <circle cx="520" cy="536" r="2.5" fill="#ffe082" /><path d="M 520 536 Q 518 530 520 526 Q 522 530 520 536 Z" fill="#ff5500" />
    <circle cx="590" cy="536" r="2.5" fill="#ffe082" /><path d="M 590 536 Q 588 530 590 526 Q 592 530 590 536 Z" fill="#ff5500" />
    <circle cx="660" cy="536" r="2.5" fill="#ffe082" /><path d="M 660 536 Q 658 530 660 526 Q 662 530 660 536 Z" fill="#ff5500" />
    <circle cx="730" cy="536" r="2.5" fill="#ffe082" /><path d="M 730 536 Q 728 530 730 526 Q 732 530 730 536 Z" fill="#ff5500" />
    <circle cx="800" cy="536" r="2.5" fill="#ffe082" /><path d="M 800 536 Q 798 530 800 526 Q 802 530 800 536 Z" fill="#ff5500" />
    <circle cx="870" cy="536" r="2.5" fill="#ffe082" /><path d="M 870 536 Q 868 530 870 526 Q 872 530 870 536 Z" fill="#ff5500" />
    
    <circle cx="1050" cy="536" r="2.5" fill="#ffe082" /><path d="M 1050 536 Q 1048 530 1050 526 Q 1052 530 1050 536 Z" fill="#ff5500" />
    <circle cx="1120" cy="536" r="2.5" fill="#ffe082" /><path d="M 1120 536 Q 1118 530 1120 526 Q 1122 530 1120 536 Z" fill="#ff5500" />
    <circle cx="1190" cy="536" r="2.5" fill="#ffe082" /><path d="M 1190 536 Q 1188 530 1190 526 Q 1192 530 1190 536 Z" fill="#ff5500" />
    <circle cx="1260" cy="536" r="2.5" fill="#ffe082" /><path d="M 1260 536 Q 1258 530 1260 526 Q 1262 530 1260 536 Z" fill="#ff5500" />
    <circle cx="1330" cy="536" r="2.5" fill="#ffe082" /><path d="M 1330 536 Q 1328 530 1330 526 Q 1332 530 1330 536 Z" fill="#ff5500" />
    <circle cx="1400" cy="536" r="2.5" fill="#ffe082" /><path d="M 1400 536 Q 1398 530 1400 526 Q 1402 530 1400 536 Z" fill="#ff5500" />
    <circle cx="1470" cy="536" r="2.5" fill="#ffe082" /><path d="M 1470 536 Q 1468 530 1470 526 Q 1472 530 1470 536 Z" fill="#ff5500" />
  </g>

  <!-- =========================================================================
       LAYER 5: SARAYU RIVER GHAT STEPS & SOFT WATER HORIZON (Y=580 to Y=620)
       ========================================================================= -->
  <g fill="none" stroke="rgba(255, 215, 0, 0.4)" stroke-width="1">
    <line x1="0" y1="590" x2="1920" y2="590" />
    <line x1="0" y1="605" x2="1920" y2="605" stroke="rgba(255, 179, 0, 0.3)" stroke-dasharray="12,8" />
    <line x1="0" y1="618" x2="1920" y2="618" stroke="rgba(255, 143, 0, 0.2)" />
  </g>
</svg>
