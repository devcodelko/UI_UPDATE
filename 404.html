<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found - UPICON Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background-color: var(--body-bg);">

  <div class="container text-center py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="mb-4 text-primary">
          <i class="bi bi-compass" style="font-size: 5rem;"></i>
        </div>
        <h1 class="display-1 fw-bold text-dark mb-0">404</h1>
        <h3 class="fw-bold text-dark mt-2 mb-3">Oops! Page Not Found</h3>
        <p class="text-muted mb-4">
          The requested page could not be located or may have been permanently moved. Please verify the URL or return to your administration dashboard.
        </p>
        <div class="d-flex justify-content-center gap-2">
          <a href="dashboard.html" class="btn btn-primary px-4 py-2">
            <i class="bi bi-grid-fill me-1"></i> Return to Dashboard
          </a>
          <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 py-2">
            <i class="bi bi-arrow-left me-1"></i> Go Back
          </a>
        </div>
      </div>
    </div>
  </div>

    <script src="assets/js/sidebar.js"></script>
</body>
</html>
