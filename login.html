<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - UPICON Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">

  <!-- Google Fonts & Bootstrap Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <a href="dashboard.html" class="auth-logo">
        <img src="assets/images/upicon-logo.png" alt="UPICON" class="auth-brand-logo">
      </a>

      <div class="text-center mb-4">
        <h4 class="fw-bold text-dark mb-1">Welcome Back</h4>
        <p class="text-muted small">Enter your credentials to access your administration portal</p>
      </div>

      <form id="login-form" class="needs-validation" novalidate>
        <div class="mb-3">
          <label for="login-email" class="form-label">Email or Username <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="login-email" placeholder="test@gmail.com" required>
            <div class="invalid-feedback">Please enter a valid email address.</div>
          </div>
        </div>

        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="login-password" class="form-label mb-0">Password <span class="text-danger">*</span></label>
            <a href="forgot-password.html" class="small text-decoration-none">Forgot password?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="login-password" placeholder="Enter your password" required>
            <button class="btn btn-outline-secondary password-toggle-btn" type="button" data-target="login-password">
              <i class="bi bi-eye"></i>
            </button>
            <div class="invalid-feedback">Password is required.</div>
          </div>
        </div>

        <button type="submit" id="btn-login-submit" class="btn btn-primary w-100 py-2">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
        </button>
      </form>
    </div>
  </div>

  <!-- Vendors & Core Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/form-validation.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Handle Login Submit
      AppForm.initValidation('#login-form', function (form) {
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const submitBtn = document.getElementById('btn-login-submit');

        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span> Authenticating...';
        submitBtn.setAttribute('disabled', 'disabled');

        setTimeout(() => {
          const success = Auth.login(email, password, true);
          if (!success) {
            submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard';
            submitBtn.removeAttribute('disabled');
          }
        }, 400);
      });
    });
  </script>
</body>

</html>
