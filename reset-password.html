<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - UPICON Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <a href="dashboard.html" class="auth-logo">
        <img src="assets/images/upicon-logo.png" alt="UPICON" class="auth-brand-logo">
      </a>

      <div class="text-center mb-4">
        <h4 class="fw-bold text-dark mb-1">Set New Password</h4>
        <p class="text-muted small">Create a strong, unique password to secure your admin account</p>
      </div>

      <form id="reset-password-form" class="needs-validation" novalidate>
        <!-- New Password -->
        <div class="mb-3">
          <label for="new-password" class="form-label">New Password <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="new-password" placeholder="At least 8 characters" minlength="8" required>
            <button class="btn btn-outline-secondary password-toggle-btn" type="button" data-target="new-password">
              <i class="bi bi-eye"></i>
            </button>
            <div class="invalid-feedback">Password must be at least 8 characters long.</div>
          </div>
          <!-- Strength Meter -->
          <div class="strength-meter mt-2">
            <div id="password-strength-bar" class="strength-meter-bar"></div>
          </div>
          <div class="d-flex justify-content-between align-items-center mt-1">
            <span id="password-strength-text" class="small text-muted" style="font-size: 0.75rem;"></span>
            <span class="small text-muted" style="font-size: 0.75rem;">Min. 8 chars, numbers & symbols</span>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="mb-4">
          <label for="confirm-password" class="form-label">Confirm New Password <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-check2-circle"></i></span>
            <input type="password" class="form-control" id="confirm-password" placeholder="Repeat your new password" required>
            <button class="btn btn-outline-secondary password-toggle-btn" type="button" data-target="confirm-password">
              <i class="bi bi-eye"></i>
            </button>
            <div class="invalid-feedback">Please confirm your password.</div>
          </div>
          <div id="match-error" class="text-danger small mt-1 d-none">Passwords do not match.</div>
        </div>

        <button type="submit" id="btn-reset-submit" class="btn btn-primary w-100 py-2 mb-3">
          <i class="bi bi-shield-check me-1"></i> Update & Reset Password
        </button>

        <div class="text-center">
          <a href="login.html" class="text-muted small text-decoration-none d-inline-flex align-items-center gap-1">
            <i class="bi bi-arrow-left"></i> Back to Sign In
          </a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <script src="assets/js/notifications.js"></script>
    <script src="assets/js/auth.js"></script>
  <script src="assets/js/form-validation.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      AppForm.initPasswordStrength('#new-password', '#password-strength-bar', '#password-strength-text');

      AppForm.initValidation('#reset-password-form', function (form) {
        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        const matchError = document.getElementById('match-error');

        if (newPassword !== confirmPassword) {
          matchError.classList.remove('d-none');
          return;
        }
        matchError.classList.add('d-none');

        const submitBtn = document.getElementById('btn-reset-submit');
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span> Updating...';
        submitBtn.setAttribute('disabled', 'disabled');

        setTimeout(() => {
          AppNotification.success('Your password has been successfully reset! You can now sign in with your new credentials.', 'Password Updated')
            .then(() => {
              window.location.href = 'login.html';
            });
        }, 600);
      });
    });
  </script>
</body>
</html>
