<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/assets/images/upicon-logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UPICON - UP Industrial Consultants Limited | Government of Uttar Pradesh Joint Venture</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@300;400;500;600;700;800;900&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />

  <script>
    (function () {
      try {
        var isHi = (document.cookie && (document.cookie.indexOf('googtrans=/en/hi') !== -1 || document.cookie.indexOf('googtrans=/auto/hi') !== -1)) ||
                   (localStorage.getItem('upicon_lang') === 'hi') ||
                   (localStorage.getItem('upicon_preferred_lang') === 'hi');
        if (isHi) {
          document.documentElement.lang = 'hi';
          document.documentElement.classList.add('lang-hi');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Bootstrap 5 Framework CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Swiper 11 Slider CSS -->
  <link href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" rel="stylesheet" />

  <!-- AOS Animation CSS -->
  <link href="https://unpkg.com/aos@next/dist/aos.css" rel="stylesheet" />

  <!-- UPICON Custom Design Tokens & Asset CSS -->
  <link href="/assets/css/style.css?v=20261023" rel="stylesheet" />
</head>

<body class="bg-white text-slate-900 antialiased">
  <!-- Google Translate Element (Hidden) -->
  <div id="google_translate_element" style="display:none; visibility:hidden; position:absolute; left:-9999px;"></div>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,hi',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <div id="root"></div>
  <!-- Lenis Smooth Scrolling -->
  <script src="/assets/js/lenis.min.js"></script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
